spring.application.name=guardian-api

# ──────────────────────────────────────────────────────────────────────────────
# Datasource — los valores por defecto son para desarrollo local con Docker.
# En cloud se sobreescriben via SPRING_DATASOURCE_URL / USERNAME / PASSWORD.
# ──────────────────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/guardian}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:guardian_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:guardian_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# open-in-view=false: obliga a que las entidades se mapeen a DTO dentro de la
# transaccion del service. Con el default (true) una relacion LAZY se puede
# cargar accidentalmente al serializar el response, escondiendo N+1 queries.
spring.jpa.open-in-view=false

# 8484 y no 8080/8088: en la maquina de desarrollo esos ya los ocupan los
# contenedores de otro proyecto. En cloud el puerto lo inyecta la plataforma
# via PORT y este default no aplica.
server.port=${PORT:8484}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# El indicador de correo, FUERA de la salud del servicio.
#
# Spring lo agrega solo por tener el starter de mail, y abre una conexion SMTP
# en cada sondeo. Sin SMTP configurado —que es un estado previsto: el sistema
# arranca igual y escribe el codigo de recuperacion en el log— ese indicador
# falla siempre y /actuator/health devuelve 503 para siempre. Con eso, el
# orquestador da por caida una aplicacion que esta atendiendo la porteria sin
# problemas, y termina reiniciandola en un bucle.
#
# La salud responde "puedo atender la porteria", no "puedo mandar correos".
# Que el correo no salga se ve en el log y solo afecta a recuperar la clave.
management.health.mail.enabled=false

# ──────────────────────────────────────────────────────────────────────────────
# Seguridad
# ──────────────────────────────────────────────────────────────────────────────
# CORS — whitelist de origenes (CSV). NO usar '*'.
# guardian-ui corre en 4200 (ng serve default); 4300 queda en la lista como
# alterno para cuando el 4200 lo ocupe el dev server de otro proyecto.
guardian.security.allowed-origins=${GUARDIAN_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300}

# Secreto del JWT de sesion (HS256, minimo 32 bytes).
# El default es SOLO para desarrollo local. En prod va por Secret Manager.
guardian.security.jwt-secret=${GUARDIAN_JWT_SECRET:guardian-local-dev-secret-change-me-32b!}
guardian.security.jwt-ttl-horas=${GUARDIAN_JWT_TTL_HORAS:12}

# Frescura del estado de sesion. El filtro relee de la base (via cache) el
# activo/rol/cambio-pendiente de cada usuario: este TTL es el maximo de
# segundos que una deshabilitacion puede tardar en surtir efecto.
guardian.security.estado-cache-segundos=${GUARDIAN_ESTADO_CACHE_SEGUNDOS:60}

# Freno de fuerza bruta del login: tras N fallos, el documento queda bloqueado
# durante la ventana. El mensaje hacia afuera sigue siendo el generico.
guardian.security.login-max-intentos=${GUARDIAN_LOGIN_MAX_INTENTOS:5}
guardian.security.login-bloqueo-minutos=${GUARDIAN_LOGIN_BLOQUEO_MINUTOS:15}

# Clave HMAC que firma el payload del QR. Es INDEPENDIENTE del secreto del JWT
# a proposito: son dos superficies distintas y comprometer la sesion de un
# usuario no debe permitir fabricar credenciales de acceso al conjunto.
#
# OJO: si esta clave cambia, TODOS los QR emitidos dejan de validar y hay que
# reemitirlos. No rotarla sin un plan de reemision.
guardian.security.qr-hmac-secret=${GUARDIAN_QR_HMAC_SECRET:guardian-local-qr-hmac-change-me-32bytes!}

# ──────────────────────────────────────────────────────────────────────────────
# Reglas de acceso
# ──────────────────────────────────────────────────────────────────────────────
# El sentido del proximo evento NO es configurable: lo decide la presencia
# (adentro -> SALIDA, afuera -> ENTRADA), sin ventana de tiempo.

# Anti doble-escaneo: dos lecturas de la misma credencial separadas por menos de
# estos segundos se consideran la misma. Sin esto, el guardia que escanea dos
# veces por nervios genera una ENTRADA y una SALIDA fantasma.
guardian.acceso.segundos-anti-rebote=${GUARDIAN_ANTI_REBOTE:20}

# Ventana del conteo de invitados ADENTRO. Un invitado que salio sin escanear
# no debe inflar el conteo de evacuacion para siempre; pasada la ventana deja
# de contarse (pero si de verdad sigue adentro, su salida se registra igual).
guardian.acceso.horas-presencia-invitado=${GUARDIAN_HORAS_PRESENCIA_INVITADO:24}

# ──────────────────────────────────────────────────────────────────────────────
# Invitaciones — topes que hacen cumplir la promesa de "QR efimero".
# ──────────────────────────────────────────────────────────────────────────────
guardian.invitacion.dias-vigencia-maxima=${GUARDIAN_INVITACION_DIAS_MAXIMOS:30}

# Vigencia del codigo con el que un familiar se registra en un hogar. Corto a
# proposito: ese codigo crea una persona DENTRO del conjunto, y si se filtra
# hay un desconocido con credencial. Un dia basta para pasarselo a alguien.
guardian.hogar.horas-vigencia-codigo=${GUARDIAN_HOGAR_HORAS_CODIGO:24}

# ──────────────────────────────────────────────────────────────────────────────
# Bootstrap del super administrador. Sin esto no hay forma de entrar a un
# sistema recien instalado.
#
# La cuenta entra directo solo si la clave configurada pasa las MISMAS reglas
# que el sistema le exige a cualquiera que elige la suya. Si no las pasa —igual
# al usuario, publicada aca en git, o mas corta que el minimo— se fuerza el
# cambio en el primer ingreso. El default (2306) cae en dos de los tres casos,
# asi que sirve para entrar una vez y nada mas.
# ──────────────────────────────────────────────────────────────────────────────
# Es la UNICA cuenta que siembra el sistema. Un GUARDIAN recien instalado
# arranca sin sedes: el super administrador las crea desde el panel de
# plataforma y le nombra su administrador a cada una.
guardian.bootstrap.super-admin-documento=${GUARDIAN_SUPER_ADMIN_DOCUMENTO:SUPERADMIN}
guardian.bootstrap.super-admin-clave=${GUARDIAN_SUPER_ADMIN_CLAVE:2306}

# ──────────────────────────────────────────────────────────────────────────────
# Almacenamiento de fotos de personas.
# local (dev, filesystem) | gcs (prod, Google Cloud Storage — pendiente F2).
#
# OJO: la ruta por defecto es RELATIVA al directorio desde el que se arranca el
# proceso, no a la raiz del proyecto. Arrancar el jar desde otra carpeta crea
# ahi un data-fotos nuevo y las fotos ya subidas dejan de encontrarse — la
# porteria muestra la ficha sin cara, que es justo el control que hace el
# guardia. Por eso guardian.ps1 arranca el backend con -WorkingDirectory en la
# raiz del repo, y quien lo lance a mano debe pasar STORAGE_LOCAL_PATH
# absoluto. El compose lo sobreescribe a /data/fotos (volumen con dueno
# correcto).
# ──────────────────────────────────────────────────────────────────────────────
storage.type=${STORAGE_TYPE:local}
storage.local.path=${STORAGE_LOCAL_PATH:./data-fotos}

# Subida multipart de fotos: el limite real (5 MB) lo valida FotoController;
# esto solo evita que Spring corte antes con el default de 1 MB.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# ──────────────────────────────────────────────────────────────────────────────
# Correo. Unico canal de recuperacion de clave.
#
# SIN CONFIGURAR el sistema arranca igual: el codigo se escribe en el log en
# vez de enviarse. Eso permite desarrollar y probar el flujo completo sin una
# cuenta SMTP, y evita que un despliegue sin credenciales tumbe el arranque —
# lo que dejaria la porteria abajo por una funcion que no es la porteria.
#
# En produccion: GUARDIAN_SMTP_HOST, _USUARIO y _CLAVE por Secret Manager.
# ──────────────────────────────────────────────────────────────────────────────
spring.mail.host=${GUARDIAN_SMTP_HOST:}
spring.mail.port=${GUARDIAN_SMTP_PUERTO:587}
spring.mail.username=${GUARDIAN_SMTP_USUARIO:}
spring.mail.password=${GUARDIAN_SMTP_CLAVE:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Sin esto, un SMTP caido cuelga el hilo de la peticion hasta el timeout del SO.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

guardian.correo.remitente=${GUARDIAN_CORREO_REMITENTE:no-responder@guardian.local}
guardian.correo.nombre-remitente=${GUARDIAN_CORREO_NOMBRE:GUARDIAN}

# ──────────────────────────────────────────────────────────────────────────────
# Recuperacion de clave por codigo.
# ──────────────────────────────────────────────────────────────────────────────
# Corto a proposito: el codigo viaja al correo y de ahi a la pantalla en menos
# de un minuto. Diez da margen para buscarlo en spam sin dejar la ventana
# abierta media hora.
guardian.recuperacion.minutos-vigencia=${GUARDIAN_RECUPERACION_MINUTOS:10}
# Seis digitos son un millon de combinaciones. Con tope de intentos y diez
# minutos de vida, adivinarlo exige mas suerte de la que hay.
guardian.recuperacion.intentos-maximos=${GUARDIAN_RECUPERACION_INTENTOS:5}
# Frena el uso del sistema como maquina de spam contra el buzon de un vecino.
guardian.recuperacion.solicitudes-por-hora=${GUARDIAN_RECUPERACION_SOLICITUDES:3}

logging.level.guardian=${LOG_LEVEL_GUARDIAN:INFO}
