spring.application.name=guardian-api

# ──────────────────────────────────────────────────────────────────────────────
# Datasource — los valores por defecto son para desarrollo local con Docker.
# En cloud se sobreescriben via SPRING_DATASOURCE_URL / USERNAME / PASSWORD.
# ──────────────────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/guardian}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:guardian_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:guardian_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# open-in-view=false: obliga a que las entidades se mapeen a DTO dentro de la
# transaccion del service. Con el default (true) una relacion LAZY se puede
# cargar accidentalmente al serializar el response, escondiendo N+1 queries.
spring.jpa.open-in-view=false

# 8484 y no 8080/8088: en la maquina de desarrollo esos ya los ocupan los
# contenedores de otro proyecto. En cloud el puerto lo inyecta la plataforma
# via PORT y este default no aplica.
server.port=${PORT:8484}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ──────────────────────────────────────────────────────────────────────────────
# Seguridad
# ──────────────────────────────────────────────────────────────────────────────
# CORS — whitelist de origenes (CSV). NO usar '*'.
# guardian-ui corre en 4200 (ng serve default); 4300 queda en la lista como
# alterno para cuando el 4200 lo ocupe el dev server de otro proyecto.
guardian.security.allowed-origins=${GUARDIAN_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300}

# Secreto del JWT de sesion (HS256, minimo 32 bytes).
# El default es SOLO para desarrollo local. En prod va por Secret Manager.
guardian.security.jwt-secret=${GUARDIAN_JWT_SECRET:guardian-local-dev-secret-change-me-32b!}
guardian.security.jwt-ttl-horas=${GUARDIAN_JWT_TTL_HORAS:12}

# Frescura del estado de sesion. El filtro relee de la base (via cache) el
# activo/rol/cambio-pendiente de cada usuario: este TTL es el maximo de
# segundos que una deshabilitacion puede tardar en surtir efecto.
guardian.security.estado-cache-segundos=${GUARDIAN_ESTADO_CACHE_SEGUNDOS:60}

# Freno de fuerza bruta del login: tras N fallos, el documento queda bloqueado
# durante la ventana. El mensaje hacia afuera sigue siendo el generico.
guardian.security.login-max-intentos=${GUARDIAN_LOGIN_MAX_INTENTOS:5}
guardian.security.login-bloqueo-minutos=${GUARDIAN_LOGIN_BLOQUEO_MINUTOS:15}

# Clave HMAC que firma el payload del QR. Es INDEPENDIENTE del secreto del JWT
# a proposito: son dos superficies distintas y comprometer la sesion de un
# usuario no debe permitir fabricar credenciales de acceso al conjunto.
#
# OJO: si esta clave cambia, TODOS los QR emitidos dejan de validar y hay que
# reemitirlos. No rotarla sin un plan de reemision.
guardian.security.qr-hmac-secret=${GUARDIAN_QR_HMAC_SECRET:guardian-local-qr-hmac-change-me-32bytes!}

# ──────────────────────────────────────────────────────────────────────────────
# Reglas de acceso
# ──────────────────────────────────────────────────────────────────────────────
# El sentido del proximo evento NO es configurable: lo decide la presencia
# (adentro -> SALIDA, afuera -> ENTRADA), sin ventana de tiempo.

# Anti doble-escaneo: dos lecturas de la misma credencial separadas por menos de
# estos segundos se consideran la misma. Sin esto, el guardia que escanea dos
# veces por nervios genera una ENTRADA y una SALIDA fantasma.
guardian.acceso.segundos-anti-rebote=${GUARDIAN_ANTI_REBOTE:20}

# Ventana del conteo de invitados ADENTRO. Un invitado que salio sin escanear
# no debe inflar el conteo de evacuacion para siempre; pasada la ventana deja
# de contarse (pero si de verdad sigue adentro, su salida se registra igual).
guardian.acceso.horas-presencia-invitado=${GUARDIAN_HORAS_PRESENCIA_INVITADO:24}

# ──────────────────────────────────────────────────────────────────────────────
# Invitaciones — topes que hacen cumplir la promesa de "QR efimero".
# ──────────────────────────────────────────────────────────────────────────────
guardian.invitacion.dias-vigencia-maxima=${GUARDIAN_INVITACION_DIAS_MAXIMOS:30}
guardian.invitacion.usos-maximos-tope=${GUARDIAN_INVITACION_USOS_TOPE:20}

# ──────────────────────────────────────────────────────────────────────────────
# Bootstrap del administrador inicial. Sin esto no hay forma de entrar al
# sistema recien instalado.
#
# Si la clave configurada es DISTINTA del usuario, la cuenta entra directo
# (requiereCambioClave=N): quien la definio ya eligio una clave propia. Si son
# iguales (el caso degenerado "usuario=clave"), se fuerza el cambio en el
# primer ingreso igual que a cualquier residente.
# ──────────────────────────────────────────────────────────────────────────────
guardian.bootstrap.admin-documento=${GUARDIAN_ADMIN_DOCUMENTO:ADMIN}
guardian.bootstrap.admin-clave=${GUARDIAN_ADMIN_CLAVE:230614}
guardian.bootstrap.conjunto-nombre=${GUARDIAN_CONJUNTO_NOMBRE:Conjunto Residencial}

# ──────────────────────────────────────────────────────────────────────────────
# Almacenamiento de fotos de personas.
# local (dev, filesystem) | gcs (prod, Google Cloud Storage — pendiente F2).
# El default relativo funciona corriendo el jar desde cualquier carpeta local;
# el compose lo sobreescribe a /data/fotos (volumen con dueno correcto).
# ──────────────────────────────────────────────────────────────────────────────
storage.type=${STORAGE_TYPE:local}
storage.local.path=${STORAGE_LOCAL_PATH:./data-fotos}

# Subida multipart de fotos: el limite real (5 MB) lo valida FotoController;
# esto solo evita que Spring corte antes con el default de 1 MB.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

logging.level.guardian=${LOG_LEVEL_GUARDIAN:INFO}
