<div class="panel">

  <!-- Cabecera compacta: identidad y una sola puerta. La navegación NO vive
       aquí, vive abajo, donde llega el pulgar. -->
  <header class="cabecera">
    <!-- Primero a la izquierda y con el nombre del destino: es donde se busca
         la salida, y "←" sin texto obliga a adivinar a dónde lleva. -->
    <a class="volver" *ngIf="deVisita" [routerLink]="panelPropio">
      <i class="pi pi-arrow-left"></i>
      <span>{{ nombrePanelPropio }}</span>
    </a>

    <div class="identidad" *ngIf="sesion">
      <span class="saludo">{{ saludo }}</span>
      <span class="nombre">{{ primerNombre }}</span>
    </div>

    <div class="utilidades">
      <span class="casa" *ngIf="sesion?.casaIdentificador">
        <i class="pi pi-home"></i> {{ sesion?.casaIdentificador }}
      </span>

      <button type="button" class="avatar" (click)="mostrarCuenta = true"
              aria-label="Mi cuenta">
        {{ inicial }}
      </button>
    </div>
  </header>

  <main>
    <router-outlet></router-outlet>
  </main>

  <!-- Barra inferior: la convención nativa. Tres destinos, siempre visibles,
       el activo con color y peso, nunca con un borde. -->
  <nav class="tabbar" role="tablist">
    <a routerLink="mi-qr" routerLinkActive="activa" class="tab">
      <i class="pi pi-qrcode"></i>
      <span>Mi QR</span>
    </a>
    <a routerLink="mi-hogar" routerLinkActive="activa" class="tab">
      <i class="pi pi-home"></i>
      <span>Mi hogar</span>
    </a>
    <a routerLink="invitados" routerLinkActive="activa" class="tab">
      <i class="pi pi-ticket"></i>
      <span>Invitados</span>
    </a>
  </nav>

  <!-- Mi cuenta. Ninguna app nativa tiene "cerrar sesión" a un toque en la
       pantalla principal, ni cuatro iconos sin nombre en la esquina. -->
  <gd-hoja [abierta]="mostrarCuenta" titulo="Mi cuenta"
           (cerrar)="mostrarCuenta = false">

    <div class="ficha-cuenta" *ngIf="sesion">
      <span class="nombre-completo">{{ sesion.nombreCompleto }}</span>
      <span class="gd-muted">
        {{ sesion.rol }}
        <ng-container *ngIf="sesion.casaIdentificador">
          · {{ sesion.casaIdentificador }}
        </ng-container>
      </span>
    </div>

    <h3 class="gd-titulo-seccion">Apariencia</h3>
    <div class="gd-lista">
      <button type="button" class="gd-fila gd-presionable"
              *ngFor="let opcion of opcionesTema"
              (click)="tema.fijar(opcion.valor)">
        <i class="pi" [ngClass]="opcion.icono"></i>
        <span class="etiqueta">{{ opcion.nombre }}</span>
        <i class="pi pi-check marca" *ngIf="tema.preferencia === opcion.valor"></i>
      </button>
    </div>

    <h3 class="gd-titulo-seccion">Seguridad</h3>
    <div class="gd-lista">
      <a class="gd-fila gd-presionable" routerLink="/cambiar-clave"
         (click)="mostrarCuenta = false">
        <i class="pi pi-key"></i>
        <span class="etiqueta">Cambiar mi PIN</span>
        <i class="pi pi-chevron-right marca"></i>
      </a>
    </div>

    <ng-container *ngIf="puedeIrAPorteria || puedeIrAAdmin">
      <h3 class="gd-titulo-seccion">Otros paneles</h3>
      <div class="gd-lista">
        <a class="gd-fila gd-presionable" routerLink="/porteria"
           *ngIf="puedeIrAPorteria" (click)="mostrarCuenta = false">
          <i class="pi pi-shield"></i>
          <span class="etiqueta">Portería</span>
          <i class="pi pi-chevron-right marca"></i>
        </a>
        <a class="gd-fila gd-presionable" routerLink="/admin"
           *ngIf="puedeIrAAdmin" (click)="mostrarCuenta = false">
          <i class="pi pi-cog"></i>
          <span class="etiqueta">Administración</span>
          <i class="pi pi-chevron-right marca"></i>
        </a>
      </div>
    </ng-container>

    <div class="gd-lista salir">
      <button type="button" class="gd-fila gd-presionable gd-fila--destructiva"
              (click)="salir()">
        Cerrar sesión
      </button>
    </div>
  </gd-hoja>
</div>
