<div class="consola">
  <header class="cabecera">
    <div class="titulo">
      <i class="pi pi-shield"></i>
      <div class="textos">
        <strong>PORTERÍA</strong>
        <small *ngIf="sesion">{{ sesion.nombreCompleto }}</small>
      </div>
    </div>

    <div class="acciones">
      <!-- Con texto y no solo el engranaje: el administrador que entra a la
           portería tiene que ver de un vistazo por dónde se devuelve. El
           guardia vive acá y no lo ve. -->
      <a class="volver" *ngIf="deVisita" [routerLink]="panelPropio">
        <i class="pi pi-arrow-left"></i>
        <span>{{ nombrePanelPropio }}</span>
      </a>

      <a routerLink="/app" class="icono" pTooltip="Mi cuenta" tooltipPosition="bottom">
        <i class="pi pi-user"></i>
      </a>
      <button type="button" class="icono" (click)="tema.alternar()"
              [attr.aria-label]="tema.oscuro ? 'Modo claro' : 'Modo oscuro'">
        <i class="pi" [ngClass]="tema.oscuro ? 'pi-sun' : 'pi-moon'"></i>
      </button>
      <button type="button" class="icono" (click)="salir()" aria-label="Salir"
              pTooltip="Salir" tooltipPosition="bottom">
        <i class="pi pi-sign-out"></i>
      </button>
    </div>
  </header>

  <main>
    <router-outlet></router-outlet>
  </main>
</div>
