<div class="consola">
  <header class="cabecera">
    <!-- Volver al principio, no entre los iconos de la derecha: es la ranura
         de navegación de cualquier cabecera, y allá desequilibraba la esquina
         de acciones con un botón del doble de tamaño. -->
    <div class="navegacion">
      <gd-volver></gd-volver>

      <div class="titulo">
        <i class="pi pi-shield"></i>
        <div class="textos">
          <strong>PORTERÍA</strong>
          <small *ngIf="sesion">{{ sesion.nombreCompleto }}</small>
        </div>
      </div>
    </div>

    <div class="acciones">
      <a routerLink="/app" class="icono" pTooltip="Mi cuenta" tooltipPosition="bottom">
        <i class="pi pi-user"></i>
      </a>
      <button type="button" class="icono" (click)="tema.alternar()"
              [attr.aria-label]="tema.oscuro ? 'Modo claro' : 'Modo oscuro'">
        <i class="pi" [ngClass]="tema.oscuro ? 'pi-sun' : 'pi-moon'"></i>
      </button>
      <button type="button" class="icono" (click)="salir()" aria-label="Salir"
              pTooltip="Salir" tooltipPosition="bottom">
        <i class="pi pi-sign-out"></i>
      </button>
    </div>
  </header>

  <main>
    <router-outlet></router-outlet>
  </main>
</div>
