<div class="oficina">
  <aside class="lateral">
    <div class="marca">
      <i class="pi pi-shield"></i>
      <div class="textos">
        <strong>GUARDIAN</strong>
        <small>{{ sesion?.sedeNombre || 'Administración' }}</small>
      </div>
    </div>

    <nav class="secciones">
      <a *ngFor="let seccion of secciones"
         [routerLink]="seccion.ruta"
         routerLinkActive="activa">
        <i class="pi" [ngClass]="seccion.icono"></i>
        <span>{{ seccion.etiqueta }}</span>
      </a>
    </nav>

    <div class="atajos">
      <a routerLink="/porteria" *ngIf="!suplantando">
        <i class="pi pi-shield"></i>
        <span>Portería</span>
      </a>
      <a routerLink="/app" *ngIf="!suplantando">
        <i class="pi pi-user"></i>
        <span>Mi cuenta</span>
      </a>
      <!-- Botón y no routerLink: irse a /sedes con un enlace dejaría la
           suplantación viva en el token, y el siguiente panel que se abriera
           seguiría operando sobre esta sede sin decirlo. -->
      <button type="button" *ngIf="suplantando"
              (click)="salirDeSede()" [disabled]="saliendo">
        <i class="pi pi-sitemap"></i>
        <span>Todas las sedes</span>
      </button>

      <!-- La clave propia no se cambia desde el panel de Usuarios: ahí el
           administrador no se ve a sí mismo. Este es su único camino. -->
      <a routerLink="/cambiar-clave">
        <i class="pi pi-key"></i>
        <span>Mi contraseña</span>
      </a>
    </div>

    <div class="pie" *ngIf="sesion">
      <div class="quien">
        <strong>{{ sesion.nombreCompleto }}</strong>
        <small>{{ sesion.rol }}</small>
      </div>
      <div class="botones">
        <button type="button" (click)="tema.alternar()"
                [attr.aria-label]="tema.oscuro ? 'Modo claro' : 'Modo oscuro'">
          <i class="pi" [ngClass]="tema.oscuro ? 'pi-sun' : 'pi-moon'"></i>
        </button>
        <button type="button" (click)="salir()" aria-label="Salir"
                pTooltip="Salir" tooltipPosition="top">
          <i class="pi pi-sign-out"></i>
        </button>
      </div>
    </div>
  </aside>

  <main>
    <!-- Permanente y pegada arriba, no un aviso que se cierra: el operador de
         la plataforma está editando datos de OTRO conjunto. Si olvida en cuál
         está, borra la casa equivocada de la sede equivocada. -->
    <div class="banda-sede" *ngIf="suplantando" role="status">
      <i class="pi pi-eye"></i>
      <span class="texto">
        Estás dentro de <strong>{{ sesion?.sedeNombre }}</strong>
      </span>
      <button type="button" (click)="salirDeSede()" [disabled]="saliendo">
        <i class="pi pi-sign-out"></i>
        Salir de la sede
      </button>
    </div>

    <router-outlet></router-outlet>
  </main>
</div>
