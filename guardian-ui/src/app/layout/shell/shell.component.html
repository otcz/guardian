<header class="barra">
  <div class="marca">
    <i class="pi pi-shield"></i>
    <span>GUARDIAN</span>
  </div>

  <nav class="menu">
    <a routerLink="/mi-qr" routerLinkActive="activo">Mi QR</a>
    <a *ngIf="esGuardia" routerLink="/garita" routerLinkActive="activo">Portería</a>
    <a *ngIf="esAdmin" routerLink="/admin/casas" routerLinkActive="activo">Casas</a>
    <a *ngIf="esAdmin" routerLink="/admin/personas" routerLinkActive="activo">Personas</a>
  </nav>

  <div class="usuario">
    <button type="button"
            class="icono"
            (click)="alternarTema()"
            [attr.aria-label]="modoOscuro ? 'Modo claro' : 'Modo oscuro'"
            [pTooltip]="modoOscuro ? 'Modo claro' : 'Modo oscuro'"
            tooltipPosition="bottom">
      <i class="pi" [ngClass]="modoOscuro ? 'pi-sun' : 'pi-moon'"></i>
    </button>

    <span class="nombre" *ngIf="sesion">
      {{ sesion.nombreCompleto }}
      <small>{{ sesion.rol }}</small>
    </span>

    <button type="button"
            class="icono"
            (click)="salir()"
            aria-label="Salir"
            pTooltip="Salir"
            tooltipPosition="bottom">
      <i class="pi pi-sign-out"></i>
    </button>
  </div>
</header>

<main>
  <router-outlet></router-outlet>
</main>
