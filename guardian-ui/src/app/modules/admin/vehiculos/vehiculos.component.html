<div class="gd-page">
  <div class="encabezado">
    <h1>Vehículos</h1>
    <button type="button" class="principal"
            (click)="mostrarAlta ? cancelarEdicion() : (mostrarAlta = true)">
      <i class="pi" [ngClass]="mostrarAlta ? 'pi-times' : 'pi-plus'"></i>
      {{ mostrarAlta ? 'Cancelar' : 'Registrar' }}
    </button>
  </div>

  <form class="alta gd-card" *ngIf="mostrarAlta" [formGroup]="formulario" (ngSubmit)="guardar()">
    <div class="campo">
      <label for="casa">Casa</label>
      <select id="casa" formControlName="casaId">
        <option [ngValue]="null">Selecciona…</option>
        <option *ngFor="let casa of casas" [ngValue]="casa.id">{{ casa.identificador }}</option>
      </select>
    </div>

    <div class="campo">
      <label for="placa">Placa</label>
      <input id="placa" type="text" formControlName="placa" placeholder="Ej: ABC123">
    </div>

    <div class="campo">
      <label for="tipo">Tipo</label>
      <select id="tipo" formControlName="tipo">
        <option value="">Selecciona…</option>
        <option *ngFor="let t of tipos" [value]="t.codigo">{{ t.valor }}</option>
      </select>
    </div>

    <div class="campo">
      <label for="marca">
        Marca
        <i class="pi pi-info-circle ayuda"
           pTooltip="¿Falta alguna? Agrégala en Configuración"
           tooltipPosition="top"></i>
      </label>
      <select id="marca" formControlName="marca">
        <option value="">Sin marca</option>
        <option *ngFor="let m of marcas" [value]="m.codigo">{{ m.valor }}</option>
      </select>
    </div>

    <div class="campo">
      <label for="color">Color</label>
      <select id="color" formControlName="color">
        <option value="">Sin color</option>
        <option *ngFor="let c of colores" [value]="c.codigo">{{ c.valor }}</option>
      </select>
    </div>

    <button type="submit" class="principal" [disabled]="guardando">
      <i class="pi pi-check"></i>
      {{ editando ? 'Guardar cambios' : 'Guardar' }}
    </button>
  </form>

  <div class="aviso-error" *ngIf="error">{{ error }}</div>

  <p class="gd-muted" *ngIf="cargando">Cargando…</p>

  <table class="tabla gd-card" *ngIf="!cargando">
    <thead>
      <tr>
        <th>Placa</th>
        <th>Casa</th>
        <th>Tipo</th>
        <th>Marca</th>
        <th>Color</th>
        <th>Estado</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let vehiculo of vehiculos" [class.inactiva]="!activo(vehiculo)">
        <td class="fuerte">{{ vehiculo.placa }}</td>
        <td>{{ vehiculo.casaIdentificador }}</td>
        <td>{{ vehiculo.tipoNombre ?? vehiculo.tipo }}</td>
        <td>{{ vehiculo.marcaNombre ?? '—' }}</td>
        <td>{{ vehiculo.colorNombre ?? '—' }}</td>
        <td>
          <span class="pastilla" [class.si]="operativo(vehiculo)" [class.no]="!operativo(vehiculo)"
                [class.candado]="bloqueado(vehiculo)"
                [attr.tabindex]="bloqueado(vehiculo) ? 0 : null"
                [pTooltip]="vehiculo.motivoBloqueo || ''" tooltipPosition="top">
            <i class="pi pi-lock" *ngIf="bloqueado(vehiculo)"></i>
            {{ estado(vehiculo) }}
          </span>
        </td>
        <td class="derecha acciones">
          <button type="button" class="accion"
                  (click)="editar(vehiculo)"
                  [attr.aria-label]="'Editar ' + vehiculo.placa"
                  pTooltip="Editar" tooltipPosition="left">
            <i class="pi pi-pencil"></i>
          </button>
          <button type="button" class="accion"
                  (click)="alternarEstado(vehiculo)"
                  [attr.aria-label]="(activo(vehiculo) ? 'Inhabilitar ' : 'Habilitar ') + vehiculo.placa"
                  [pTooltip]="activo(vehiculo) ? 'Inhabilitar' : 'Habilitar'"
                  tooltipPosition="left">
            <i class="pi" [ngClass]="activo(vehiculo) ? 'pi-ban' : 'pi-check'"></i>
          </button>

          <!-- El residente habilita e inhabilita su carro; el candado lo pone
               solo la administración y él no puede quitarlo. -->
          <span class="separador" aria-hidden="true"></span>

          <button type="button" class="accion candado"
                  [class.puesto]="bloqueado(vehiculo)"
                  (click)="alternarBloqueo(vehiculo)"
                  [attr.aria-label]="(bloqueado(vehiculo) ? 'Levantar el bloqueo de ' : 'Bloquear ')
                    + vehiculo.placa"
                  [pTooltip]="bloqueado(vehiculo) ? 'Levantar bloqueo' : 'Bloquear'"
                  tooltipPosition="left">
            <i class="pi" [ngClass]="bloqueado(vehiculo) ? 'pi-lock-open' : 'pi-lock'"></i>
          </button>

          <button type="button" class="accion peligro"
                  (click)="eliminar(vehiculo)"
                  pTooltip="Eliminar" tooltipPosition="left">
            <i class="pi pi-trash"></i>
          </button>
        </td>
      </tr>

      <tr *ngIf="vehiculos.length === 0">
        <td colspan="7" class="vacio">Todavía no hay vehículos registrados.</td>
      </tr>
    </tbody>
  </table>

  <gd-bloqueo [abierta]="!!bloqueando"
              [objetivo]="bloqueando?.placa || ''"
              [descripcion]="'El vehículo ' + (bloqueando?.placa || '') + ' desaparece de la '
                + 'portería y no puede entrar ni salir hasta que la administración levante el '
                + 'bloqueo. Sus dueños no pueden quitarlo desde la aplicación.'"
              (confirmar)="confirmarBloqueo($event)"
              (cerrar)="bloqueando = null">
  </gd-bloqueo>
</div>
