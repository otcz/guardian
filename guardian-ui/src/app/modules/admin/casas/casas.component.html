<div class="gd-page">
  <h1>Casas</h1>

  <form class="alta gd-card" [formGroup]="formulario" (ngSubmit)="guardar()"
        [class.editando]="editando">
    <div class="campo">
      <label for="torre">
        Tipo
        <i class="pi pi-info-circle ayuda"
           pTooltip="¿Falta alguno? Agrégalo en Configuración"
           tooltipPosition="top"></i>
      </label>
      <select id="torre" formControlName="torre">
        <option value="">Selecciona…</option>
        <option *ngFor="let t of tiposVivienda" [value]="t.codigo">{{ t.valor }}</option>
      </select>
    </div>

    <div class="campo">
      <label for="numero">Número</label>
      <input id="numero" type="text" formControlName="numero" placeholder="Ej: 101">
    </div>

    <div class="campo">
      <label for="cupos">
        Cupos
        <i class="pi pi-info-circle ayuda"
           pTooltip="Parqueaderos asignados"
           tooltipPosition="top"></i>
      </label>
      <input id="cupos" type="number" min="0" formControlName="cuposParqueadero">
    </div>

    <button type="submit" class="principal" [disabled]="guardando">
      <i class="pi" [ngClass]="editando ? 'pi-check' : 'pi-plus'"></i>
      {{ editando ? 'Guardar cambios' : 'Agregar' }}
    </button>

    <button type="button" class="alterno" *ngIf="editando" (click)="cancelarEdicion()">
      Cancelar
    </button>
  </form>

  <div class="aviso-error" *ngIf="error">{{ error }}</div>

  <p class="gd-muted" *ngIf="cargando">Cargando…</p>

  <table class="tabla gd-card" *ngIf="!cargando">
    <thead>
      <tr>
        <th>Casa</th>
        <th>Residentes</th>
        <th>Vehículos</th>
        <th>Cupos</th>
        <th>Estado</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let casa of casas" [class.inactiva]="!activa(casa)">
        <td class="fuerte">{{ casa.identificador }}</td>
        <td>{{ casa.residentes }}</td>
        <td>{{ casa.vehiculos }}</td>
        <td>{{ casa.cuposParqueadero ?? '—' }}</td>
        <td>
          <span class="pastilla" [class.si]="operativa(casa)" [class.no]="!operativa(casa)"
                [class.candado]="bloqueada(casa)"
                [attr.tabindex]="bloqueada(casa) ? 0 : null"
                [pTooltip]="casa.motivoBloqueo || ''" tooltipPosition="top">
            <i class="pi pi-lock" *ngIf="bloqueada(casa)"></i>
            {{ estado(casa) }}
          </span>
        </td>
        <td class="derecha acciones">
          <button type="button" class="accion"
                  (click)="editar(casa)"
                  [attr.aria-label]="'Editar ' + casa.identificador"
                  pTooltip="Editar" tooltipPosition="left">
            <i class="pi pi-pencil"></i>
          </button>
          <button type="button"
                  class="accion"
                  (click)="alternarEstado(casa)"
                  [attr.aria-label]="(activa(casa) ? 'Desactivar ' : 'Activar ') + casa.identificador"
                  [pTooltip]="activa(casa) ? 'Desactivar la casa completa' : 'Activar'"
                  tooltipPosition="left">
            <i class="pi" [ngClass]="activa(casa) ? 'pi-ban' : 'pi-check'"></i>
          </button>

          <span class="separador" aria-hidden="true"></span>

          <button type="button" class="accion candado"
                  [class.puesto]="bloqueada(casa)"
                  (click)="alternarBloqueo(casa)"
                  [attr.aria-label]="(bloqueada(casa) ? 'Habilitar ' : 'Deshabilitar ')
                    + casa.identificador"
                  [pTooltip]="bloqueada(casa) ? 'Habilitar' : 'Deshabilitar'"
                  tooltipPosition="left">
            <i class="pi" [ngClass]="bloqueada(casa) ? 'pi-lock-open' : 'pi-lock'"></i>
          </button>
        </td>
      </tr>

      <tr *ngIf="casas.length === 0">
        <td colspan="6" class="vacio">Todavía no hay casas registradas.</td>
      </tr>
    </tbody>
  </table>

  <gd-bloqueo [abierta]="!!bloqueando"
              [objetivo]="bloqueando?.identificador || ''"
              [descripcion]="'Nadie de ' + (bloqueando?.identificador || '') + ' podrá ingresar '
                + 'al conjunto —ni sus residentes ni sus vehículos— hasta que la administración '
                + 'vuelva a habilitarla.'"
              (confirmar)="confirmarBloqueo($event)"
              (cerrar)="bloqueando = null">
  </gd-bloqueo>
</div>
