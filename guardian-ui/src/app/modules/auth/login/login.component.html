<div class="pantalla">
  <form class="tarjeta" [formGroup]="formulario" (ngSubmit)="entrar()">

    <div class="marca">
      <i class="pi pi-shield"></i>
      <h1>GUARDIAN</h1>
      <p>Control de acceso del conjunto</p>
    </div>

    <div class="campo">
      <label for="documento">Usuario</label>
      <input id="documento"
             #campoDocumento
             type="text"
             autocomplete="username"
             formControlName="documento"
             placeholder="Ej: 1020304050">
      <small class="error" *ngIf="campoInvalido('documento')">
        Escribe tu usuario
      </small>
    </div>

    <div class="campo">
      <label for="clave">Contraseña</label>
      <div class="clave-envoltura">
        <input id="clave"
               [type]="verClave ? 'text' : 'password'"
               autocomplete="current-password"
               formControlName="clave">
        <button type="button"
                class="ver-clave"
                (click)="verClave = !verClave"
                [attr.aria-label]="verClave ? 'Ocultar contraseña' : 'Ver contraseña'">
          <i class="pi" [ngClass]="verClave ? 'pi-eye-slash' : 'pi-eye'"></i>
        </button>
      </div>
      <small class="error" *ngIf="campoInvalido('clave')">
        Escribe tu contraseña
      </small>
    </div>

    <label class="recordar">
      <input type="checkbox" [(ngModel)]="recordar" [ngModelOptions]="{ standalone: true }">
      <span>Recordar mi usuario</span>
    </label>

    <div class="aviso" *ngIf="error">{{ error }}</div>

    <button type="submit" class="principal" [disabled]="cargando">
      <i class="pi" [ngClass]="cargando ? 'pi-spinner pi-spin' : 'pi-sign-in'"></i>
      {{ cargando ? 'Entrando…' : 'Entrar' }}
    </button>

    <p class="pie">
      ¿Primera vez? Tu usuario es tu número de documento y tu contraseña es
      <strong>0000</strong>. Al entrar tendrás que cambiarla.<br>
      ¿Olvidaste tu contraseña? La administración puede restablecerla.
    </p>
  </form>
</div>
