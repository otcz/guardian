<div class="pantalla">
  <form class="tarjeta" [formGroup]="formulario" (ngSubmit)="guardar()">

    <div class="encabezado">
      <i class="pi pi-lock"></i>
      <h1>Cambia tu contraseña</h1>
      <p *ngIf="obligatorio">
        Estás usando tu documento como contraseña. Elige una nueva para proteger tu cuenta.
      </p>
    </div>

    <div class="campo">
      <label for="actual">Contraseña actual</label>
      <div class="clave-envoltura">
        <input id="actual" [type]="verActual ? 'text' : 'password'"
               autocomplete="current-password"
               formControlName="claveActual">
        <button type="button"
                class="ver-clave"
                (click)="verActual = !verActual"
                [attr.aria-label]="verActual ? 'Ocultar contraseña' : 'Ver contraseña'">
          <i class="pi" [ngClass]="verActual ? 'pi-eye-slash' : 'pi-eye'"></i>
        </button>
      </div>
      <small class="error" *ngIf="campoInvalido('claveActual')">
        Escribe tu contraseña actual
      </small>
    </div>

    <div class="campo">
      <label for="nueva">
        Nueva contraseña
        <i class="pi pi-info-circle ayuda"
           pTooltip="Mínimo 8 caracteres"
           tooltipPosition="top"></i>
      </label>
      <div class="clave-envoltura">
        <input id="nueva" [type]="verNueva ? 'text' : 'password'"
               autocomplete="new-password"
               formControlName="claveNueva">
        <button type="button"
                class="ver-clave"
                (click)="verNueva = !verNueva"
                [attr.aria-label]="verNueva ? 'Ocultar contraseña' : 'Ver contraseña'">
          <i class="pi" [ngClass]="verNueva ? 'pi-eye-slash' : 'pi-eye'"></i>
        </button>
      </div>
      <small class="error" *ngIf="campoInvalido('claveNueva')">
        Mínimo 8 caracteres
      </small>
    </div>

    <div class="campo">
      <label for="confirmacion">Repite la nueva</label>
      <div class="clave-envoltura">
        <input id="confirmacion" [type]="verConfirmacion ? 'text' : 'password'"
               autocomplete="new-password"
               formControlName="confirmacion">
        <button type="button"
                class="ver-clave"
                (click)="verConfirmacion = !verConfirmacion"
                [attr.aria-label]="verConfirmacion ? 'Ocultar contraseña' : 'Ver contraseña'">
          <i class="pi" [ngClass]="verConfirmacion ? 'pi-eye-slash' : 'pi-eye'"></i>
        </button>
      </div>
      <small class="error" *ngIf="noCoinciden">Las contraseñas no coinciden</small>
    </div>

    <div class="aviso" *ngIf="error">{{ error }}</div>

    <button type="submit" class="principal" [disabled]="cargando">
      <i class="pi" [ngClass]="cargando ? 'pi-spinner pi-spin' : 'pi-check'"></i>
      {{ cargando ? 'Guardando…' : 'Guardar' }}
    </button>

    <button type="button" class="secundario" (click)="salir()">Salir</button>
  </form>
</div>
