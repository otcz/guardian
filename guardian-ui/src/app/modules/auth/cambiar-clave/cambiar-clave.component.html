<div class="pantalla">
  <form class="tarjeta" [formGroup]="formulario" (ngSubmit)="guardar()">

    <div class="encabezado">
      <i class="pi pi-lock"></i>
      <h1>Cambia tu contraseña</h1>
      <p *ngIf="obligatorio">
        Estás usando tu documento como contraseña. Elige una nueva para proteger tu cuenta.
      </p>
    </div>

    <div class="campo">
      <label for="actual">Contraseña actual</label>
      <input id="actual" type="password" autocomplete="current-password"
             formControlName="claveActual">
      <small class="error" *ngIf="campoInvalido('claveActual')">
        Escribe tu contraseña actual
      </small>
    </div>

    <div class="campo">
      <label for="nueva">
        Nueva contraseña
        <i class="pi pi-info-circle ayuda"
           pTooltip="Mínimo 8 caracteres"
           tooltipPosition="top"></i>
      </label>
      <input id="nueva" type="password" autocomplete="new-password"
             formControlName="claveNueva">
      <small class="error" *ngIf="campoInvalido('claveNueva')">
        Mínimo 8 caracteres
      </small>
    </div>

    <div class="campo">
      <label for="confirmacion">Repite la nueva</label>
      <input id="confirmacion" type="password" autocomplete="new-password"
             formControlName="confirmacion">
      <small class="error" *ngIf="noCoinciden">Las contraseñas no coinciden</small>
    </div>

    <div class="aviso" *ngIf="error">{{ error }}</div>

    <button type="submit" class="principal" [disabled]="cargando">
      <i class="pi" [ngClass]="cargando ? 'pi-spinner pi-spin' : 'pi-check'"></i>
      {{ cargando ? 'Guardando…' : 'Guardar' }}
    </button>

    <button type="button" class="secundario" (click)="salir()">Salir</button>
  </form>
</div>
