<div class="cuadro">
  <div class="marco" [class.vacio]="!vistaPrevia">
    <img *ngIf="vistaPrevia" [src]="vistaPrevia" alt="Foto">
    <i class="ms" *ngIf="!vistaPrevia && !cargando">person</i>
    <i class="ms gira" *ngIf="cargando">progress_activity</i>
  </div>

  <div class="acciones">
    <label class="boton">
      <i class="ms">photo_camera</i>
      {{ vistaPrevia ? 'Cambiar' : 'Subir foto' }}
      <input type="file"
             accept="image/*"
             (change)="alSeleccionar($event)">
    </label>

    <button type="button"
            class="quitar"
            *ngIf="vistaPrevia"
            (click)="quitar()"
            pTooltip="Quitar foto"
            tooltipPosition="top">
      <i class="ms">close</i>
    </button>
  </div>

  <small class="error" *ngIf="error">{{ error }}</small>
</div>
