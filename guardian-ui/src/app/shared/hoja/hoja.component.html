<div class="velo" *ngIf="abierta" (click)="cerrar.emit()"
     [style.z-index]="'calc(var(--z-hoja) + ' + nivel + ')'"></div>

<section class="hoja"
         *ngIf="abierta"
         role="dialog"
         aria-modal="true"
         [attr.aria-label]="titulo"
         [style.z-index]="'calc(var(--z-hoja) + ' + (nivel + 1) + ')'">
  <!-- El tirador dice "esto se cierra arrastrando" sin una sola palabra.
       En escritorio no aplica: ahí no se arrastra, se hace clic fuera. -->
  <div class="tirador"></div>

  <!-- La cabecera se dibuja SIEMPRE, tenga título o no: acá vive la X, y
       colgarla del título dejaba sin forma de cerrar a las hojas que no lo
       llevan —la del código del invitado, sin ir más lejos—. Sin título la
       cabecera es solo la X y no separa nada. -->
  <header class="encabezado" [class.sin-titulo]="!titulo">
    <div class="textos" *ngIf="titulo">
      <h2 class="titulo">{{ titulo }}</h2>
      <!-- El contexto va en su propia línea y no dentro del título: en el
           back-office los títulos como "Administrador de SANTA BARBARA"
           crecen con el nombre y terminan cortados o en dos renglones. -->
      <p class="subtitulo" *ngIf="subtitulo">{{ subtitulo }}</p>
    </div>

    <!-- data-no-autofoco: sin esto el foco al abrir cae en la X en vez del
         primer campo, y quien escribe a teclado empieza en el botón de salir. -->
    <button type="button" class="cerrar" data-no-autofoco
            (click)="cerrar.emit()" aria-label="Cerrar">
      <i class="ms">close</i>
    </button>
  </header>

  <!-- El pie vive DENTRO del cuerpo que se desplaza, no como hermano suyo.
       Es la garantia de ultimo recurso: un pie anclado al fondo SIEMPRE puede
       quedar detras del teclado de iOS, pero a un pie que va al final del
       contenido se llega bajando, pase lo que pase con el teclado. En
       escritorio vuelve a quedar pegado abajo, que ahi no hay teclado virtual
       que lo tape. -->
  <div class="cuerpo">
    <ng-content></ng-content>

    <div class="pie">
      <ng-content select="[pie]"></ng-content>
    </div>
  </div>
</section>
