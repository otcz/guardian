<gd-hoja [abierta]="visible" titulo="Deshabilitar" (cerrar)="cerrar.emit()">

  <p class="explicacion">{{ texto }}</p>

  <form id="forma-bloqueo" (ngSubmit)="aceptar()">
    <div class="campo">
      <label for="motivo-bloqueo">Motivo</label>
      <textarea id="motivo-bloqueo" name="motivo" maxlength="200" rows="4"
                [(ngModel)]="motivo" gdMayusculas placeholder="Ej: Cartera vencida"></textarea>
      <span class="contador">{{ motivo.length }}/200</span>
    </div>
  </form>

  <div pie>
    <button type="button" class="alterno" (click)="cerrar.emit()">Cancelar</button>
    <button type="submit" form="forma-bloqueo" class="principal peligro"
            [disabled]="!motivo.trim()">
      Deshabilitar
    </button>
  </div>
</gd-hoja>
