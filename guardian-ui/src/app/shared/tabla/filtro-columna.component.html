<button type="button" class="gatillo"
        [class.activo]="activo"
        [attr.aria-expanded]="abierto"
        [attr.aria-label]="'Filtrar por ' + campo"
        (click)="alternarMenu()">
  <!-- El mismo glifo, hueco o relleno. En Material el relleno es un EJE de la
       fuente y no otro icono, asi que "hay filtro puesto" se dice sin que la
       forma cambie: el ojo lo lee como el mismo embudo, mas marcado. -->
  <i class="ms" [class.lleno]="activo">filter_alt</i>
  <span class="cuantos" *ngIf="cuantos">{{ cuantos }}</span>
</button>

<div class="menu" *ngIf="abierto">
  <!-- Buscador dentro del menú: una columna "Casa" de un conjunto real trae
       cientos de valores, y sin él hay que rodarlos todos. -->
  <div class="buscar">
    <i class="ms">search</i>
    <input type="search" [(ngModel)]="busqueda" placeholder="Buscar" aria-label="Buscar valor">
  </div>

  <div class="valores">
    <button type="button" class="valor"
            *ngFor="let v of valores"
            [class.marcado]="marcado(v)"
            (click)="alternar(v)">
      <i class="ms">{{ marcado(v) ? 'check_box' : 'check_box_outline_blank' }}</i>
      <span>{{ v }}</span>
    </button>

    <p class="vacio" *ngIf="valores.length === 0">Sin coincidencias</p>
  </div>

  <div class="pie">
    <button type="button" (click)="marcarTodos()">Marcar todo</button>
    <button type="button" [disabled]="!activo" (click)="limpiar()">Quitar filtro</button>
  </div>
</div>
