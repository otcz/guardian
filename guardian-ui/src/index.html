<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>GUARDIAN</title>
  <base href="/">
  <!-- viewport-fit=cover NO es opcional: sin él, env(safe-area-inset-*) siempre
       devuelve 0 y la barra inferior queda debajo del indicador de gestos. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <!-- SVG primero: el navegador que lo entienda lo usa y se ve nítido en
       cualquier densidad. El .ico queda de respaldo para los que no.

       `sizes="any"` NO sobra: sin él Chrome compara tamaños entre los dos
       iconos, el SVG no declara ninguno y termina perdiendo contra el .ico.
       Con "any" queda dicho que ese sirve para cualquier tamaño y gana. -->
  <link rel="icon" type="image/svg+xml" sizes="any" href="brand/guardian-emblema-oscuro.svg?v=2">
  <link rel="icon" type="image/x-icon" sizes="32x32" href="favicon.ico?v=2">
  <link rel="apple-touch-icon" href="icons/icon-180x180.png?v=2">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Tipografía de marca. `display=swap` para que el texto se lea de una con
       la fuente de sistema y cambie cuando llegue la de marca: en la garita
       con mala señal, esperar a la fuente sería dejar la pantalla en blanco. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">

  <!-- La barra de estado continúa el color de la pantalla, no un azul que no
       aparece en ningún lado. Copia literal de --bg-base en cada modo. -->
  <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1624" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GUARDIAN">
</head>
<body>
  <app-root></app-root>
  <noscript>Activa JavaScript para usar la aplicación.</noscript>
</body>
</html>
