name: guardian

# ============================================================================
# GUARDIAN — stack de desarrollo local
# ============================================================================
# Para el dia a dia NO uses esto directamente:
#
#   .\guardian.ps1 start
#
# Ese script levanta Postgres aca y el backend y el frontend SUELTOS en la
# maquina, que es como conviene desarrollar: con el backend en un contenedor
# cada cambio de codigo obliga a reconstruir la imagen (Maven baja, compila y
# empaqueta adentro), y el frontend perderia la recarga en caliente.
#
# El servicio guardian-api de abajo existe para probar la imagen que despues
# corre en Cloud Run, no para trabajar:
#   docker compose -f infra/docker-compose.yml up -d --build
# ============================================================================

services:

  postgres:
    image: postgres:14
    container_name: guardian_postgres
    restart: always
    environment:
      POSTGRES_USER: guardian_user
      POSTGRES_PASSWORD: guardian_pass
      POSTGRES_DB: guardian
    # 5434 en el host y no 5432: la maquina de desarrollo ya corre otros
    # proyectos con Postgres — 5432 y 5433 estan tomados — y el choque solo se
    # descubre cuando el contenedor arranca contra la base equivocada.
    ports:
      - "5434:5432"
    volumes:
      - guardian_postgres_data:/var/lib/postgresql/data
    networks:
      - guardian-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian_user -d guardian"]
      interval: 10s
      timeout: 5s
      retries: 5

  guardian-api:
    build:
      context: ../guardian-api
      dockerfile: Dockerfile
    container_name: guardian_api
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/guardian
      SPRING_DATASOURCE_USERNAME: guardian_user
      SPRING_DATASOURCE_PASSWORD: guardian_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      GUARDIAN_ALLOWED_ORIGINS: ${GUARDIAN_ALLOWED_ORIGINS:-http://localhost:4200}

      # Secretos de desarrollo. En produccion van por Secret Manager.
      # El del QR es independiente del de sesion a proposito: comprometer la
      # sesion de un usuario no debe permitir fabricar credenciales de acceso.
      #
      # OJO: si GUARDIAN_QR_HMAC_SECRET cambia, TODOS los QR emitidos dejan de
      # validar y hay que reemitirlos.
      GUARDIAN_JWT_SECRET: ${GUARDIAN_JWT_SECRET:-guardian-local-dev-secret-change-me-32b!}
      GUARDIAN_QR_HMAC_SECRET: ${GUARDIAN_QR_HMAC_SECRET:-guardian-local-qr-hmac-change-me-32bytes!}

      # La UNICA cuenta que siembra el sistema. Un GUARDIAN nuevo arranca sin
      # sedes: el super administrador las crea desde el panel de plataforma.
      #
      # Si esta clave se deja en su default, la cuenta nace con cambio
      # obligatorio en el primer ingreso — el sistema no deja entrar de largo
      # con una clave que esta publicada en git.
      GUARDIAN_SUPER_ADMIN_DOCUMENTO: ${GUARDIAN_SUPER_ADMIN_DOCUMENTO:-SUPERADMIN}
      GUARDIAN_SUPER_ADMIN_CLAVE: ${GUARDIAN_SUPER_ADMIN_CLAVE:-2306}

      # La aplicacion fija esta zona ANTES de arrancar Spring. Las columnas de
      # fecha guardan hora de PARED, no el instante: si el proceso corriera en
      # UTC, lo ya guardado se leeria cinco horas corrido. TZ ademas alinea la
      # hora de los logs del contenedor con la de la aplicacion.
      GUARDIAN_ZONA_HORARIA: ${GUARDIAN_ZONA_HORARIA:-America/Bogota}
      TZ: ${GUARDIAN_ZONA_HORARIA:-America/Bogota}

      # Correo: unico canal de recuperacion de clave. SIN configurar, el
      # sistema arranca igual y el codigo se escribe en el log en vez de
      # enviarse — el flujo se prueba completo sin una cuenta SMTP.
      #
      # Los valores van en infra/.env, que esta en .gitignore. NUNCA aca:
      # este archivo si se commitea.
      #
      # Con Gmail la clave NO es la de la cuenta —Google dejo de aceptarla en
      # 2022— sino una "contrasena de aplicacion" de 16 letras, que solo se
      # puede generar con la verificacion en dos pasos activada.
      GUARDIAN_SMTP_HOST: ${GUARDIAN_SMTP_HOST:-}
      GUARDIAN_SMTP_PUERTO: ${GUARDIAN_SMTP_PUERTO:-587}
      GUARDIAN_SMTP_USUARIO: ${GUARDIAN_SMTP_USUARIO:-}
      GUARDIAN_SMTP_CLAVE: ${GUARDIAN_SMTP_CLAVE:-}
      GUARDIAN_CORREO_REMITENTE: ${GUARDIAN_CORREO_REMITENTE:-no-responder@guardian.local}
      GUARDIAN_CORREO_NOMBRE: ${GUARDIAN_CORREO_NOMBRE:-GUARDIAN}

      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      # OJO: dentro del contenedor las fotos van a un volumen de Docker, no a
      # ./data-fotos. Si alternas entre correr el backend aca y en la maquina,
      # cada uno ve SUS fotos y las del otro salen rotas.
      STORAGE_LOCAL_PATH: /data/fotos
      # Dentro del contenedor la app escucha en 8080 (el default de server.port
      # es 8484 para el dev local SIN docker; aca se fija explicito para que el
      # EXPOSE y el healthcheck del Dockerfile sigan siendo ciertos).
      PORT: "8080"
    # 8484 en el host: 8080 y 8088 los ocupan los contenedores de otro proyecto.
    ports:
      - "8484:8080"
    volumes:
      - guardian_fotos:/data/fotos
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - guardian-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: guardian_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@guardian.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5051:80"
    volumes:
      - guardian_pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - guardian-net

volumes:
  guardian_postgres_data:
  guardian_pgadmin_data:
  guardian_fotos:

networks:
  guardian-net:
    driver: bridge
